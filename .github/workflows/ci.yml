name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets here, on purpose: if a change breaks the offline path, it breaks CI.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: The demo still tells a story
        run: |
          hypengine demo --fault outer_race --no-verify
          hypengine demo --fault misalignment --no-verify
