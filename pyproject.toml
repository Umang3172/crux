[project]
name = "hypothesis-engine"
version = "0.1.0"
description = "An AI investigator for machine faults: physics-grounded hypotheses, virtual experiments, and evidence it asks a human to collect."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MechNova" }]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Cloud + model adapters. The core runs without any of these.
llm = [
    "google-genai>=1.0",
    "google-adk>=1.0",
]
jev = [
    "langchain-typesafe>=0.0.1a3",
]
# The when-to-fix forecaster's learned model. Without it the forecaster falls
# back to trend extrapolation, which needs only numpy.
forecast = [
    "scikit-learn>=1.4",
]
# Google's TimesFM through BigQuery, a forecaster that needs Google Cloud's
# login. Only `scripts/forecast.py timesfm` and an opted-in server use it.
timesfm = [
    "google-cloud-bigquery>=3.20",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "scikit-learn>=1.4",
    "av>=12",
    "pillow>=10",
]
lens = [
    "av>=12",
    "pillow>=10",
]

[project.scripts]
hypengine = "hypothesis_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypothesis_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
