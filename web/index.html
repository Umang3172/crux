<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0c11" />
    <meta
      name="description"
      content="Crux diagnoses rotating-machine faults by testing every suspect cause on a virtual copy, and asks for the one measurement that decides when it can't tell."
    />
    <title>Crux</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233d6bf5'/%3E%3Cpath d='M10 10l12 12M22 10L10 22' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23fff'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the chosen theme before the first paint, so a light-theme visitor sees no dark flash.
      try {
        if (localStorage.getItem("crux.theme") === "light") {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.background = "#f4f5f8";
        }
      } catch (e) {}
    </script>
    <style>
      /* Paint the ground before the bundle loads, so there is no white flash. */
      html {
        background: #0a0c11;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
