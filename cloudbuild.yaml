# Build the image and deploy it to Cloud Run, in one submission.
#
#   gcloud builds submit --config cloudbuild.yaml
#
# Everything project-specific is a substitution with a working default, so the
# command above needs no arguments on a project set up the way docs/DEPLOY.md
# describes. Override any of them with --substitutions _NAME=value.

substitutions:
  _REGION: asia-south1 # Mumbai: closest region to the team and the rig
  _SERVICE: hypothesis-engine
  _REPO: containers # Artifact Registry repository, created once
  # Gemini through Google Cloud's own login: the service's account calls the
  # model, so there is no key to store or leak (agents/factory.py prefers it).
  # The project is the one being built in ($PROJECT_ID). "false" drops back to
  # the key in _SECRETS, or to the offline path if that is empty too, which is
  # fully supported (docs/DECISIONS.md, ADR-0002).
  _GOOGLE_LOGIN: "true"
  _GEMINI_LOCATION: global
  # name=secret:version pairs to mount, empty by default. The key fallback is
  # GOOGLE_API_KEY=gemini-api-key:latest with _GOOGLE_LOGIN=false; a sensor
  # token is RIG_INGEST_TOKEN=rig-ingest-token:latest (unset keeps /ingest off).
  _SECRETS: ""
  # The id the code defaults to (agents/factory.py). A model id that does not
  # exist does not stop the deploy: every call fails and the product quietly
  # runs its offline paths. Check with `hypengine gemini-check` first.
  _GEMINI_MODEL: gemini-3.8-flash
  # Lens's model. The code's default, gemini-robotics-er-2-preview, is offered
  # through the Gemini API but not to a Google Cloud project (404 on 11 Oct
  # 2026; it is not in the project's model list), so the deploy names one that
  # is and that reads images: the camera look's model.
  _GEMINI_LENS_MODEL: gemini-3-flash-preview
  # 0 costs nothing and cold-starts in a few seconds. Set to 1 for the judging
  # window so the first person to open the link never waits.
  _MIN_INSTANCES: "0"

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest

steps:
  # Pull the previous image so the node and uv layers can be reused. First build
  # in a fresh project has nothing to pull, which is why this cannot fail hard.
  - id: warm-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest || true

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - .

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -eu

        # Cloud Build expands ${...} itself, so a shell variable of our own is
        # written $${...} to survive to bash. --set-secrets with an empty value
        # is an error, so the flag only appears when there is one to mount: a
        # key-less deploy is a supported configuration, not a broken one.
        SECRET_FLAG=""
        if [ -n "${_SECRETS}" ]; then
          SECRET_FLAG="--set-secrets=${_SECRETS}"
        fi

        # The timeout is longer than an investigator run's own cap (120 s in
        # agents/investigator.py) plus the case around it, so a slow model run
        # ends on the code's cap with its result, not on a gateway error.
        # One instance, on purpose: cases, notes, reports and a machine's history
        # live in the process's memory, so a second instance would not know a
        # case the first one opened. Raise it only with a store behind them.
        gcloud run deploy "${_SERVICE}" \
          --image "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --cpu 1 \
          --memory 1Gi \
          --timeout 300s \
          --min-instances "${_MIN_INSTANCES}" \
          --max-instances 1 \
          --concurrency 8 \
          --set-env-vars "GEMINI_MODEL=${_GEMINI_MODEL},GEMINI_LENS_MODEL=${_GEMINI_LENS_MODEL},GOOGLE_GENAI_USE_ENTERPRISE=${_GOOGLE_LOGIN},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_GEMINI_LOCATION}" \
          $${SECRET_FLAG}

        echo "---"
        echo "Deployed URL (this is the submission link):"
        gcloud run services describe "${_SERVICE}" --region "${_REGION}" \
          --format 'value(status.url)'

timeout: 1800s
